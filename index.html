<style>

:root{--c0:#14b8a6;--c1:#f59e0b;--c2:#ec4899;--c3:#8b5cf6}

<h1><span class="logo">🕯️📚</span> سباق الحروف</h1>
<div id="q"></div><div id="g"></div><div id="tb" class="row"></div>
<script>
if(typeof D==='undefined'||typeof BANK==='undefined'){document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<p style="padding:20px;text-align:center">تعذّر تحميل ملف الأسئلة (questions.js). تأكد أنه مرفوع بجانب index.html.</p>'})}

const $=id=>document.getElementById(id);
const L=[...'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'];
const Q=()=>D[S.t%D.length][S.l];
const E=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,n=2,T=null;
const TB=[["كم عدد الدول الأعضاء في الأمم المتحدة؟","193"],["كم عدد سور القرآن الكريم؟","114"],["كم عدد عظام جسم الإنسان البالغ؟","206"],["ما سنة هجرة النبي ﷺ ميلادياً؟","622"],["ما سنة فتح القسطنطينية ميلادياً؟","1453"],["كم عدد ركعات الصلوات المفروضة في اليوم والليلة؟","17"],["كم تقريباً ارتفاع قمة إيفرست بالمتر؟","8849"],["كم تقريباً تبعد القمر عن الأرض بالكيلومتر؟","384400"]];
let BK={};
let POOL=null;
function qid(q){let h=5381;for(let i=0;i<q.length;i++)h=((h<<5)+h+q.charCodeAt(i))|0;return 'q'+(h>>>0).toString(36)}
function buildPool(){
 POOL={};const add=(l,d,q,a)=>{const k=l+'|'+d;(POOL[k]=POOL[k]||[]).push([q,a,qid(q)])};
 D.forEach(set=>set.forEach((r,l)=>{add(l,0,r[0],r[1]);add(l,1,r[2],r[3])}));
 BANK.forEach(b=>add(b.l,b.d,b.q,b.a));
}
function poolStats(gu){if(!POOL)buildPool();let t=0,u=0;Object.values(POOL).forEach(a=>a.forEach(x=>{t++;if(gu&&gu[x[2]])u++}));return {t,left:t-u}}
function markUsed(id){
 if(!DB||!S)return;S.gu=S.gu||{};
 const p=DB.doc('pool/used'),v=S.gu[id];
 try{p.update({[id]:v}).catch(()=>{p.set({[id]:v}).catch(()=>{})})}catch(e){}
}
function pick(){
 if(!POOL)buildPool();
 const pool=POOL[S.l+'|'+S.d]||[],gu=S.gu||(S.gu={}),used=S.used||(S.used=[]);
 let c=pool.filter(x=>!used.includes(x[2])&&!gu[x[2]]);
 S.recyc=false;
 if(!c.length){S.recyc=true;c=pool.filter(x=>!used.includes(x[2])).sort((a,b)=>(gu[a[2]]||0)-(gu[b[2]]||0)).slice(0,3);if(!c.length)c=pool}
 const r=c[Math.floor(Math.random()*c.length)];
 used.push(r[2]);gu[r[2]]=Date.now();markUsed(r[2]);
 return [r[0],r[1]];
}
function tbRev(){S.rv=true;R()}
function tbNext(){S.tb=(S.tb+1)%TB.length;S.rv=false;R()}
function tbWin(i){S.win=i;S.end=true;S.ph='end';R()}
function pickL(i){S.l=i;S.ph='lvl';R()}
function ask(d){
 if(S.x2a){const p=d?200:50;if((S.sc[S.t]||0)<p){lg('رصيد '+S.names[S.t]+' لا يكفي لهذا المستوى مع المضاعفة');R();return}S.sc[S.t]-=p;S.x2=true;S.x2a=false;lg(AV[S.t%4]+' '+S.names[S.t]+' دفعوا '+p+' للمضاعفة ✖️2')}
 else S.x2=false;
 S.d=d;S.cur=pick();S.pk[S.t]++;S.ph='q';S.rv=false;S.to=false;S.run=false;S.tm=30;S.chg=false;S.req=null;S.el=null;clearInterval(T);R();
}
function rev(){clearInterval(T);S.el=S.run?30-S.tm:null;S.run=false;S.rv=true;S.req=null;R()}
function tmStart(){if(S.ph!=='q'||S.rv||S.req)return;S.el=null;S.run=true;S.tm=30;S.to=false;beep(520,120);startTimer();R()}
function tick(){try{DB.doc('rooms/'+LB.rid).update({tm:S.tm,run:!!S.run}).catch(()=>{})}catch(e){}}
function ptsNow(){return (S.d?300:100)*(S.x2?2:1)}
function lg(t){S.lg=(S.lg||[]).concat([t]).slice(-4)}
function reqPrice(h){return S.d?100:50}
function hostReq(h){
 if(!S||S.req)return;
 const t=S.t;
 if(h==='x2'){
  if(S.ph!=='pick'||S.x2a||(S.ux&&S.ux[t]))return;
  if((S.sc[t]||0)<50){lg('رصيد '+S.names[t]+' لا يكفي للمضاعفة (أقل سعر 50)');R();return}
 }else if(h==='chg'){
  if(S.ph!=='q'||S.run||S.rv||(S.uc&&S.uc[t]))return;
  if((S.sc[t]||0)<(S.d?100:50)){lg('رصيد '+S.names[t]+' لا يكفي لتغيير السؤال');R();return}
 }else return;
 S.req={h:h,p:h==='x2'?0:(S.d?100:50)};beep(660,150);R();
}
function reqOk(){
 const q=S.req;if(!q)return;S.req=null;const t=S.t;
 if(q.h==='x2'){S.ux[t]=1;S.x2a=true;lg(AV[t%4]+' '+S.names[t]+' فعّلوا المضاعفة ✖️2 (تُخصم عند اختيار المستوى)')}
 else{
  if((S.sc[t]||0)<q.p){lg('رصيد '+S.names[t]+' لا يكفي');return R()}
  S.sc[t]-=q.p;S.uc[t]=1;S.chg=true;S.cur=pick();lg(AV[t%4]+' '+S.names[t]+' دفعوا '+q.p+' لتغيير السؤال 🔄');
 }
 R();
}
function reqNo(){if(!S.req)return;lg('رفض المنظم طلب '+S.names[S.t]);S.req=null;R()}
function cancelX2(){if(!S.x2a)return;S.x2a=false;S.ux[S.t]=0;lg('أُلغيت المضاعفة وعادت للفريق '+S.names[S.t]);R()}
function lvDis(d){return (S.x2a&&(S.sc[S.t]||0)<(d?200:50))?'disabled style="opacity:.45"':''}
function reqBox(){
 const r=S.req;if(!r)return '';
 const t=r.h==='x2'?'✖️2 مضاعفة النقاط · تُخصم عند اختيار المستوى (50 سهل / 200 صعب)':'🔄 تغيير السؤال · الثمن <b>'+r.p+'</b> نقطة';
 return '<div class="st on">🙋 '+AV[S.t%4]+' '+E(S.names[S.t])+' يطلبون: <b>'+t+'</b></div><div class="row"><button class="lv e" onclick="reqOk()">✅ موافقة</button><button class="lv h" onclick="reqNo()">❌ رفض</button></div>';
}
function lgBox(){return (S&&S.lg&&S.lg.length)?'<div class="box"><small>'+S.lg.slice(-2).map(E).join('<br>')+'</small></div>':''}
function summ(nm,sc,bs,cr,ft,win){
 const idx=nm.map((_,i)=>i).sort((a,b)=>sc[b]-sc[a]),m=Math.max(...sc);
 const w=(win!=null&&win>=0)?[win]:nm.map((_,i)=>i).filter(i=>sc[i]===m);
 const bsM=Math.max(0,...bs.map(x=>x||0)),bsI=bs.indexOf(bsM),crM=Math.max(0,...cr.map(x=>x||0)),crI=cr.indexOf(crM);
 let h='<div class="box" style="text-align:center"><div class="big2">🏆 '+(w.length>1?'تعادل بين':'الفائز')+'</div><div class="v"><b>'+w.map(i=>AV[i%4]+' '+E(nm[i])).join('، ')+'</b></div>';
 h+=idx.map((i,r)=>'<div class="sbr'+(w.includes(i)?' cur':'')+'"><span>'+(['🥇','🥈','🥉','4️⃣'][r]||'')+' '+AV[i%4]+' '+E(nm[i])+'</span><b>'+sc[i]+'</b></div>').join('')+'<hr>';
 if(bsM>=2)h+='<div>🔥 أطول ستريك: '+AV[bsI%4]+' '+E(nm[bsI])+' ('+bsM+' متتالية)</div>';
 if(crM>0)h+='<div>🎯 أكثر إجابات صحيحة: '+AV[crI%4]+' '+E(nm[crI])+' ('+crM+')</div>';
 if(ft&&nm[ft.i]!==undefined)h+='<div>⚡ أسرع إجابة: '+AV[ft.i%4]+' '+E(nm[ft.i])+' في '+ft.s+' ثانية (حرف «'+L[ft.l]+'»)</div>';
 h+='</div>';
 let t='🕯️📚 سباق الحروف\n'+(w.length>1?'تعادل بين: ':'الفائز: ')+w.map(i=>nm[i]).join('، ')+'\n'+idx.map(i=>nm[i]+': '+sc[i]).join('\n');
 if(bsM>=2)t+='\n🔥 أطول ستريك: '+nm[bsI]+' ('+bsM+')';
 if(ft&&nm[ft.i]!==undefined)t+='\n⚡ أسرع إجابة: '+nm[ft.i]+' ('+ft.s+' ث)';
 return {html:h,text:t};
}
function shareSum(){const x=summ(S.names,S.sc,S.bs||[],S.cr||[],S.ft||null,S.win);try{if(navigator.share){navigator.share({text:x.text}).catch(()=>{});return}}catch(e){}try{navigator.clipboard.writeText(x.text)}catch(e){}}
function jd(ok){
 clearInterval(T);S.run=false;S.rs=(S.rs||0)+1;S.ok=ok;
 if(ok){S.sc[S.t]+=ptsNow();S.cr[S.t]=(S.cr[S.t]||0)+1;S.sk[S.t]=(S.sk[S.t]||0)+1;if(S.sk[S.t]>(S.bs[S.t]||0))S.bs[S.t]=S.sk[S.t];if(S.el!=null&&(!S.ft||S.el<S.ft.s))S.ft={i:S.t,s:S.el,l:S.l}}
 else S.sk[S.t]=0;
 burst(ok?(S.sk[S.t]>=3?'🔥':'🎉'):'😬');beep(ok?880:220,300);S.cs[S.t][S.l]=ok?1:2;S.ph='res';R();
}
function adj(i,v){S.sc[i]+=v;R()}
function setS(i,v){S.sc[i]=parseInt(v)||0;R()}
function nxt(){
 if(S.pk.every(x=>x>=10)){const m=Math.max(...S.sc),tp=S.names.map((_,i)=>i).filter(i=>S.sc[i]==m);if(tp.length>1){S.ph='tie';S.tie=tp;S.tb=Math.floor(Math.random()*TB.length);S.rv=false}else{S.end=true;S.ph='end'}}else{S.t=(S.t+1)%S.names.length;S.ph='pick';S.x2a=false;S.req=null}
 R();
}
function R(){
 let q='<div class="box">',p=S.names[S.t];
  if(S.ph=='pick')q+=`<div class="v">🎯 دور <b>${AV[S.t%4]} ${E(p)}</b></div><div class="q">ينتظر اختيار الحرف · باقي ${10-S.pk[S.t]} اختيارات</div>`+(S.req?reqBox():'')+(S.x2a?'<div class="st on">✖️2 مضاعفة مفعّلة — تُخصم عند اختيار المستوى</div>':'');
 if(S.ph=='lvl')q+=`<div class="q">${AV[S.t%4]} ${E(p)} اختاروا الحرف «${L[S.l]}»</div><div class="row"><button class="lv e" ${lvDis(0)} onclick="ask(0)">🟢 سهل · 100${S.x2a?' (−50)':''}</button><button class="lv h" ${lvDis(1)} onclick="ask(1)">🔴 صعب · 300${S.x2a?' (−200)':''}</button>${S.x2a?'<button onclick="cancelX2()">إلغاء المضاعفة</button>':''}<button onclick="S.ph='pick';R()">رجوع</button></div>`;
 if(S.ph=='q'){
  q+=`<small>${AV[S.t%4]} ${E(p)} · حرف «${L[S.l]}» · ${S.d?'🔴 صعب 300':'🟢 سهل 100'}${S.x2?' · ✖️2 مفعّلة':''}${S.chg?' · 🔄 تم التغيير':''}</small><div class="q">${E(S.cur[0])}</div>`;
  if(S.rv)q+=`<div class="v">${S.to?'⏰ انتهى الوقت':''}</div><div class="v">الإجابة: <b>${E(S.cur[1].split('|')[0])}</b></div><div class="row"><button class="lv e" onclick="jd(true)">✅ صح</button><button class="lv h" onclick="jd(false)">❌ غلط</button></div>`;
  else if(S.run)q+=`<div class="big${S.tm<=5?' warn':''}">⏱ <span id="tm">${S.tm}</span></div><div class="bar"><i id="tb2" style="width:${S.tm/30*100}%"></i></div><div class="row"><button onclick="rev()">اكشف الإجابة</button></div>`;
  else if(S.req)q+=reqBox();
  else q+=`<div class="row"><button class="lv e" style="background:var(--pr)" onclick="tmStart()">▶️ ابدأ المؤقت (30 ثانية)</button></div><small>اقرأ السؤال للفريق ثم اضغط بدء المؤقت</small><div class="row"><button onclick="rev()">اكشف الإجابة</button></div>`;
 }
 if(S.ph=='res')q+=`<div class="v" style="color:var(${S.ok?'--ok':'--bad'})"><b>${S.ok?'✅ صح! +'+ptsNow()+(S.x2?' (مضاعفة ✖️2)':''):'❌ غلط · انحجب الحرف وضاعت نقاطه'}</b></div><div class="row"><button class="lv e" style="background:var(--pr)" onclick="nxt()">التالي ⏭️</button></div>`;
 if(S.ph=='tie')q+=`<div class="v"><b>⚖️ تعادل! سؤال فاصل</b></div><div class="q">${TB[S.tb][0]}</div><small>الأقرب إلى الرقم الصحيح يفوز</small>`+(S.rv?`<div class="v">الإجابة: <b>${TB[S.tb][1]}</b></div><div class="row">`+S.tie.map(i=>`<button class="p" onclick="tbWin(${i})">🏆 ${E(S.names[i])}</button>`).join('')+`<button onclick="tbNext()">سؤال آخر</button></div>`:`<div class="row"><button class="p" onclick="tbRev()">اكشف الإجابة</button></div>`);
