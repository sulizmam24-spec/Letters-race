let DB=null,unsub=[],TS={room:null,me:null,err:''},LB={session:0,rid:'',teams:[],err:'',kicked:[],saved:null};

 LB.kicked=(LB.kicked||[]).concat([u]);
 ['names','mem','uids','sc','pk','cs'].forEach(k=>S[k].splice(i,1));
 if(S.names.length<2||S.ph==='tie'){clearInterval(T);S.end=true;S.ph='end';S.win=null}
 else if(wasCur){clearInterval(T);S.t=S.t%S.names.length;S.ph='pick';S.l=null;S.d=null;S.rv=false;S.to=false}
 else if(i<S.t)S.t--;
 gameSub();R();
}
function hostBar(){return S?'<div class="row"><button onclick="hostRefresh()">🔄 تحديث الفرق والنتائج</button></div>':''}
function save(){
 if(!DB||!DB.uid||!S||!S.room)return;
 const o={};Object.keys(S).forEach(k=>{if(k!=='sq'&&k!=='ini'&&k!=='pp')o[k]=S[k]});
 try{DB.doc('hostsave/'+DB.uid).set({host:DB.uid,room:LB.rid,session:LB.session,kicked:LB.kicked||[],st:JSON.stringify(o),ts:Date.now()}).catch(()=>{})}catch(e){}
}
function hostInit(){
 try{DB.doc('hostsave/'+DB.uid).get().then(sn=>{
  if(sn.exists){const d=sn.data();if(d&&d.host===DB.uid&&d.st){try{const o=JSON.parse(d.st);LB.saved={d,names:o.names||[],end:!!o.end}}catch(e){}}}
  if(!S)hostLobby();
 }).catch(()=>{if(!S)hostLobby()})}catch(e){hostLobby()}
}
function savedBox(){
 if(!LB.saved)return '';
 return `<div class="box"><b>🔁 توجد لعبة محفوظة</b><div class="v">${LB.saved.names.map(E).join(' · ')}${LB.saved.end?' (منتهية)':''}</div><div class="row"><button class="p" onclick="hostResume()">استئناف اللعبة</button><button onclick="LB.saved=null;hostLobby()">تجاهل</button></div></div>`;
}
function hostResume(){
 const sv=LB.saved;if(!sv)return;
 let o;try{o=JSON.parse(sv.d.st)}catch(e){LB.saved=null;return hostLobby()}
 S=o;LB.rid=sv.d.room||'';LB.session=sv.d.session;LB.kicked=sv.d.kicked||[];LB.saved=null;n=S.names.length;S.room='main';
 gameSub();
 if(S.ph==='q'&&S.run&&!S.rv&&!S.to&&S.tm>0)startTimer();
 R();
}
function hostRefresh(){
 if(S){gameSub();push();save();R()}
 else if(LB.session){lbSub();hostLobby()}
 else{hostInit();hostLobby()}
}
function pickEv(i,sn){
 if(!S||!S.uids||S.uids[i]===undefined)return;
 if(!sn.exists){S.ini[i]=1;S.sq[i]=0;return}
 const x=sn.data()||{};
 if(!S.ini[i]){S.ini[i]=1;S.sq[i]=x.seq||0;return}
 if(!x.seq||x.seq<=S.sq[i])return;S.sq[i]=x.seq;
 if(i!==S.t)return;
 if(x.kind==='l'&&S.ph==='pick'&&S.cs[S.t][x.l]===0)pickL(x.l);
 else if(x.kind==='d'&&S.ph==='lvl')ask(x.d?1:0);
}
function gameSub(){
 unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];clearInterval(S.pp);S.sq=[];S.ini=[];
 S.uids.forEach((u,i)=>{try{unsub.push(DB.doc('picks/'+u).onSnapshot(sn=>pickEv(i,sn)))}catch(e){}});
 S.pp=setInterval(()=>{if(!S||document.hidden)return;const i=S.t,u=S.uids[i];if(!u)return;try{DB.doc('picks/'+u).get().then(sn=>pickEv(i,sn)).catch(()=>{})}catch(e){}},2000);
}
function teamStart(){
 TS.un=TS.un||[];clearInterval(TS.poll);
 if(!TS.rid){$('g').innerHTML=BX('<div class="v">🕯️📚 <b>الانضمام لغرفة</b></div><input id="rcode" placeholder="رمز الغرفة (من المنظم)"><div class="row"><button class="lv e" style="background:var(--pr)" onclick="teamCode()">ادخل</button></div><small>أو افتح الرابط الذي أرسله لك المنظم.</small>');return}
 try{TS.un.push(DB.doc('rooms/'+TS.rid).onSnapshot(sn=>{TS.room=sn.exists?sn.data():null;teamRender()},()=>{}))}catch(e){}
 try{TS.un.push(DB.doc('teams/'+DB.uid).onSnapshot(sn=>{TS.me=sn.exists?sn.data():null;teamRender()},()=>{}))}catch(e){}
 TS.poll=setInterval(()=>{
  if(document.hidden)return;
  try{
   DB.doc('rooms/'+TS.rid).get().then(sn=>{const d=sn.exists?sn.data():null;if(JSON.stringify(d)!==JSON.stringify(TS.room)){TS.room=d;teamRender()}}).catch(()=>{});
   DB.doc('teams/'+DB.uid).get().then(sn=>{const d=sn.exists?sn.data():null;if(JSON.stringify(d)!==JSON.stringify(TS.me)){TS.me=d;teamRender()}}).catch(()=>{});
  }catch(e){}
 },3000);
 teamRender();
}
function teamCode(){const v=($('rcode').value||'').trim().toUpperCase();if(!v)return;TS.rid=v;try{location.hash='#team='+v}catch(e){}teamStart()}
function teamRefresh(){clearInterval(TS.poll);(TS.un||[]).forEach(f=>{try{f()}catch(e){}});TS.un=[];TS.room=null;TS.me=null;if(DB&&DB.uid)teamStart();else teamRender()}
function teamRender(){
 const g=$('g'),r=TS.room,me=TS.me;
 if(!DB||!DB.uid){g.innerHTML=BX('⏳ جاري الاتصال…');return}
 if(!r){g.innerHTML=BX('⏳ لا توجد غرفة بهذا الرمز بعد، تأكد من الرابط…');return}
 if((r.kicked||[]).includes(DB.uid)){g.innerHTML=BX('تم إخراج فريقكم من اللعبة بواسطة المنظم.');return}
 if(r.mode==='game')return teamPlay();
 if(!me||me.room!==TS.rid||me.session!==r.session){
  if(g.querySelector('#tn'))return;
  g.innerHTML=BX('<div class="v">🕯️📚 <b>تسجيل فريق</b></div><input id="tn" placeholder="اسم المجموعة"><input id="tm2" placeholder="أسماء الأعضاء (بفاصلة)"><div class="row"><button class="lv e" style="background:var(--pr)" onclick="teamReg()">سجّل</button></div><small id="te"></small>');
  return;
 }
 g.innerHTML=BX(`<div class="v"><b>${E(me.name||'')}</b></div><small>${E(me.members||'')}</small><div class="v">${me.ready?'✅ أنتم جاهزون — بانتظار بقية الفرق':'⏳ تم التسجيل — اضغطوا جاهز عندما تكونون مستعدين'}</div><div class="row"><button class="p" onclick="teamReady()" style="font-size:18px;padding:14px 26px">${me.ready?'إلغاء الجاهزية':'جاهز ✅'}</button></div>`);
}
async function teamReg(){
 const nm=$('tn').value.trim(),mm=$('tm2').value.trim(),te=$('te');
 if(!nm){te.textContent='اكتب اسم المجموعة';return}
 try{await DB.doc('teams/'+DB.uid).set({room:TS.rid,session:TS.room.session,name:nm,members:mm,ready:false,ts:Date.now()})}catch(e){te.textContent='تعذّر التسجيل: '+(e&&e.code||'')}
}
function teamReady(){if(!TS.me)return;DB.doc('teams/'+DB.uid).update({ready:!TS.me.ready}).catch(()=>{})}
function teamPlay(){
 const s=TS.room,g=$('g'),i=(s.uids||[]).indexOf(DB.uid);
 if(i<0){g.innerHTML=BX('اللعبة بدأت وفريقكم غير مسجّل فيها. انتظروا اللعبة القادمة.');TS.hasT=false;return}
 const nm=s.names||[],sc=s.sc||[],my=s.t===i,ci=i%4;
 const key=JSON.stringify([s.t,s.ph,s.sc,s.pk,s.cs,s.l,s.d,s.ok,s.end,!!s.run,!!s.rv,!!s.to,s.rs,s.names,s.win]);
 const first=TS.k===undefined;
 if(!first){
  if(s.rs&&s.rs!==TS.rs){burst(s.ok?'🎉':'😬');beep(s.ok?880:220,300);if(s.t===i)vib(s.ok?[100,50,100]:[300])}
  if(my&&s.ph==='pick'&&TS.kk!==s.t+'|pick'){vib([150,80,150]);beep(660,150)}
  if(s.end&&!TS.endd){burst('🏆');beep(990,400)}
 }
 TS.rs=s.rs;TS.kk=s.t+'|'+s.ph;TS.endd=!!s.end;
 if(TS.k===key&&TS.hasT&&$('ttm')){
  $('ttm').textContent=s.tm;const b=$('tbar');if(b)b.style.width=(s.tm/30*100)+'%';
  const w=$('tbig');if(w)w.className='big'+(s.tm<=5?' warn':'');
  if(s.tm<=5&&s.tm>0&&s.tm!==TS.lt)beep(880,90);TS.lt=s.tm;return;
 }
 if(TS.k!==key&&TS.err&&TS.err[0]==='✔')TS.err='';
 TS.k=key;TS.hasT=false;
 const cur=E(nm[s.t]||''),ca=AV[(s.t||0)%4];
 let st='';
 if(s.end){const m=Math.max(...sc),w=s.win>=0?[s.win]:nm.map((_,j)=>j).filter(j=>sc[j]===m);st=`<div class="st big2 on">🏆 ${w.length>1?'تعادل':'الفائز'}: ${w.map(j=>AV[j%4]+' '+E(nm[j])).join('، ')}</div>`}
 else if(s.ph==='tie')st='<div class="st on">⚖️ سؤال فاصل — اسمعوا المنظم</div>';
 else if(s.ph==='pick')st=my?'<div class="st on">🎯 دوركم! اختاروا حرفاً من لوحتكم</div>':`<div class="st">👀 الدور على ${ca} ${cur} — يختارون حرفاً</div>`;
 else if(s.ph==='lvl')st=my?`<div class="st on">اختاروا مستوى السؤال للحرف «${L[s.l]}»</div><div class="row"><button class="lv e" onclick="tpick('d',null,0)">🟢 سهل · 100</button><button class="lv h" onclick="tpick('d',null,1)">🔴 صعب · 300</button></div>`:`<div class="st">${ca} ${cur} اختاروا الحرف «${L[s.l]}» — بانتظار المستوى…</div>`;
 else if(s.ph==='q'){
  const lv=s.d?'🔴 صعب':'🟢 سهل',hd=`<div class="st">${ca} ${cur} · حرف «${L[s.l]}» · ${lv}</div>`;
  if(s.rv)st=hd+`<div class="st">${s.to?'⏰ انتهى الوقت!':'🔍 المنظم يكشف الإجابة…'}</div>`;
  else if(s.run){TS.hasT=true;st=hd+`<div id="tbig" class="big${s.tm<=5?' warn':''}">⏱ <span id="ttm">${s.tm}</span></div><div class="bar"><i id="tbar" style="width:${s.tm/30*100}%"></i></div>`}
  else st=hd+'<div class="st on"><span class="bounce">🕯️</span> اسمعوا السؤال من المنظم… سيبدأ الوقت قريباً</div>';
 }
 else if(s.ph==='res')st=`<div class="st ${s.ok?'okc':'badc'}">${s.ok?'✅ إجابة صحيحة!':'❌ إجابة خاطئة'} — ${ca} ${cur}</div>`;
 const row=(s.cs&&s.cs[i])||'0'.repeat(28),on=my&&s.ph==='pick';
 let h=`<div class="turn" style="background:${CL[ci]}">${AV[ci]} ${E(nm[i]||'')} · <b>${sc[i]||0}</b> نقطة</div>`;
 h+=`<div class="box">${st}<small id="te">${E(TS.err)} متبقي ${10-((s.pk||[])[i]||0)} اختيارات</small></div>`;
 h+=`<div class="bd t${ci}${on?' on':''}"><div class="gr">`+L.map((c,k)=>{const v=row[k];return `<button class="c s${v}${on&&v==='0'?' av':''}" ${on&&v==='0'?`onclick="tpick('l',${k})"`:'disabled'}>${c}</button>`}).join('')+'</div></div>';
 h+='<div class="box">'+nm.map((n2,j)=>`<div class="sbr${j===s.t&&!s.end?' cur':''}"><span>${AV[j%4]} ${E(n2)}</span><b>${sc[j]||0}</b></div>`).join('')+'</div>';
 g.innerHTML=h;
}
async function tpick(kind,l,d){
 try{await DB.doc('picks/'+DB.uid).set({kind,l:l===null?0:l,d:d||0,seq:Date.now()});TS.err='✔️ تم إرسال اختياركم…';teamPlay()}catch(e){TS.err='ما قدرت أرسل اختيارك؛ قولوا الحرف للمنظم.';teamPlay()}
}
BANK.forEach(x=>{const k=x.s+'|'+x.l+'|'+x.d;(BK[k]=BK[k]||[]).push([x.q,x.a])});
(function(){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore(),au=firebase.auth();try{fs.settings({experimentalForceLongPolling:true})}catch(e){}
  DB={uid:'',
   doc:p=>{const r=fs.doc(p);return{set:d=>r.set(d),update:d=>r.update(d),get:()=>r.get(),onSnapshot:(n,e)=>r.onSnapshot(sn=>n({exists:sn.exists,data:()=>sn.data()}),e)}},
   collection:p=>{const mk=q=>({where:(f,o,v)=>mk(q.where(f,o,v)),onSnapshot:(n,e)=>q.onSnapshot(sn=>n({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e),get:()=>q.get().then(sn=>({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}))});return mk(fs.collection(p))}};
  au.signInAnonymously().then(c=>{DB.uid=c.user.uid;if(TEAMMODE)teamStart();else if(S&&S.room){gameSub();push()}else hostInit()}).catch(e=>{$('g').innerHTML=BX('تعذّر الاتصال بقاعدة البيانات: '+E(String((e&&e.code)||e)))});
 }catch(e){}
})();
if(TEAMMODE){$('g').innerHTML='<div class="box">⏳ جاري الاتصال…</div>';$('tb').innerHTML=''}else{setup()}
</script></body></html>
